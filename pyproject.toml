[project]
name = "dispatch-iq"
version = "0.1.0"
description = "BTM gas vs. grid power arbitrage intelligence — ML/DE rebuild"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the repo root on sys.path so `import ml/pipeline/mlops` works under the bare
# `pytest` console script (CI), not just `python -m pytest` (which adds CWD itself).
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
# The rebuild lives in ml/ pipeline/ mlops/ and the new scripts. The pre-existing
# hackathon data-collection scripts and root smoke-tests are not part of it.
extend-exclude = [
    "scripts/build_historical_dataset.py",
    "scripts/fast_build.py",
    "scripts/train_spread_forecaster.py",
    "scripts/train_regime_classifier.py",
    "scripts/compute_site_rankings.py",
    "test_caiso.py",
    "test_get_current_lmp.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled above; long strings/comments allowed
