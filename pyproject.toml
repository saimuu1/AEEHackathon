[project]
name = "dispatch-iq"
version = "0.1.0"
description = "BTM gas vs. grid power arbitrage intelligence — ML/DE rebuild"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled above; long strings/comments allowed
